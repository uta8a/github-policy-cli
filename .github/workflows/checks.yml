name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [build, fmt, lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Build
        if: matrix.check == 'build'
        run: go build ./cmd/repo-policy
      - name: Check formatting
        if: matrix.check == 'fmt'
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z '*.go')
          unformatted=$(gofmt -l "${files[@]}")
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Lint
        if: matrix.check == 'lint'
        run: go vet ./...
      - name: Test
        if: matrix.check == 'test'
        run: |
          go test -race ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
