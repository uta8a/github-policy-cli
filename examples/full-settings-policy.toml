# Every supported policy setting for a GitHub Free personal public repository.
# Review and edit these values before applying; they are an example policy.
# Explicit --config replaces the built-in preset. Omit a key to leave it unchanged.
# For private repositories, remove has_wiki, fork_pr_approval_policy and [rulesets].
# Manual: Settings > General > Issues > Collaborators only.
# issues.creation_policy is unsupported by the REST API and must not be added.

[repository]
has_projects = false
allow_update_branch = true
has_issues = true
# Public only on GitHub Free, even when set to false.
has_wiki = false
delete_branch_on_merge = true
# At least one merge method must remain enabled.
allow_squash_merge = false
allow_merge_commit = true
allow_rebase_merge = false

[pull_requests]
# Options: "all", "collaborators_only". Does not enable the PR feature itself.
creation_policy = "collaborators_only"

[releases]
# Applies to future releases.
immutable = true

[security]
# Enabling requires dependency graph and Dependabot alerts already enabled.
# Alerts and version updates are not managed by this setting.
dependabot_security_updates = false

[actions]
# Must be true when managing allowed_actions, fork approval or workflow settings.
enabled = true
# Options: "all", "local_only", "selected".
# "selected" uses the existing allowlist; this CLI does not manage its patterns.
allowed_actions = "all"
# Does not update existing workflow source files to pin actions automatically.
sha_pinning_required = true
# Public only. Options: "first_time_contributors_new_to_github",
# "first_time_contributors", "all_external_contributors".
fork_pr_approval_policy = "all_external_contributors"

[actions.workflow]
# Options: "read", "write".
default_workflow_permissions = "read"
can_approve_pull_request_reviews = false

# Public only on GitHub Free. Only true is supported; omit to leave unchanged.
[rulesets]
# Manages "main" on the default branch: block deletion and force pushes,
# require signed commits and PRs, zero required approvals, merge commits only.
# Existing additional rules, PR parameters and bypass actors are preserved.
main_protection = true
# Manages "release-tags" on v* tags: owner-only creation, updates and deletion.
# Replaces existing bypass actors with the personal owner; preserves extra rules.
release_tag_protection = true
