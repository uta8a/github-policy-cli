# GitHub Free personal private repositories.
# Manual: Settings > General > Issues > Collaborators only.
# No documented REST read/write field for permanent Issue permissions.
# Rulesets are unavailable for private repositories on GitHub Free.
[repository]
has_projects = false
allow_merge_commit = true
allow_squash_merge = false
allow_rebase_merge = false
allow_update_branch = true
delete_branch_on_merge = true

[pull_requests]
creation_policy = "collaborators_only"

[releases]
immutable = true

[actions]
sha_pinning_required = true

[security]
dependabot_security_updates = false
